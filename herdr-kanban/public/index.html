<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>herdr board</title>
<link rel="stylesheet" href="board.css">
</head>
<body>
  <header id="bar">
    <div class="bar-left">
      <button id="burger" class="btn icon" type="button" aria-label="Menu" aria-expanded="false" title="Menu">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12"/></svg>
      </button>
      <select id="project-pick" class="project-pick" title="Project" aria-label="Project"></select>
      <select id="stage-pick" class="stage-pick" title="Jump to state" aria-label="Jump to board state"></select>
      <span id="project-status" class="project-status" role="status"></span>
      <span id="conn" class="conn offline" title="Connection to the board server">offline</span>
      <div id="agents" class="agents"></div>
    </div>
    <div class="bar-right">
      <a class="btn" href="/metrics.html">Metrics</a>
      <button id="review-btn" class="btn" hidden></button>
      <button id="archive-btn" class="btn" hidden></button>
      <button id="archive-cancel" class="btn" hidden>Cancel</button>
      <span id="slots" class="slots"></span>
      <button id="herdr-open" class="btn" type="button">Open herdr</button>
      <button id="project-control" class="btn" type="button" aria-label="Pause" title="Pause selected project">
        <span id="project-control-icon" aria-hidden="true"></span>
        <span id="project-control-label">Pause</span>
      </button>
    </div>
  </header>

  <div id="breaker-banner" class="breaker-banner" hidden>
    <span id="breaker-msg"></span>
    <button id="breaker-reset" class="btn">Reset</button>
  </div>

  <nav id="menu" class="menu" hidden>
    <button class="menu-item" type="button" data-view="board">Kanban</button>
    <button class="menu-item" type="button" data-view="agents">Agents <span id="menu-agents" class="menu-count">0</span></button>
    <button class="menu-item" type="button" data-view="tasks">Historical requests <span id="menu-tasks" class="menu-count">0</span></button>
    <button class="menu-item" type="button" data-view="archive">Archive <span id="menu-archive" class="menu-count">0</span></button>
    <button class="menu-item" type="button" data-view="audits">Audits</button>
    <button class="menu-item" type="button" data-view="settings">Settings</button>
  </nav>
  <div id="scrim" class="scrim" hidden></div>

  <main id="lanes" class="lanes"></main>

  <section id="screen" class="screen" hidden>
    <div class="screen-head">
      <h1 id="screen-title"></h1>
      <button id="screen-close" class="btn">Back to Kanban</button>
    </div>
    <div id="screen-body" class="screen-body"></div>
  </section>

  <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
  <aside id="drawer" class="drawer" hidden aria-labelledby="drawer-title">
    <div class="drawer-head">
      <div class="drawer-top">
        <span id="drawer-status" class="drawer-status"></span>
        <span id="drawer-id" class="drawer-id"></span>
        <button id="drawer-close" class="btn icon" type="button" aria-label="Close" title="Close (Esc)">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
        </button>
      </div>
      <h2 id="drawer-title" class="drawer-title"></h2>
      <div class="drawer-actions">
        <button id="drawer-queue" class="btn primary" type="button" hidden>Back to Queue</button>
        <button id="drawer-archive" class="btn primary" type="button" hidden>Archive</button>
        <a id="drawer-history" class="btn" target="_blank" rel="noopener">Saved history</a>
        <div class="more">
          <button id="drawer-more" class="btn icon" type="button" aria-label="More actions" title="More actions" aria-expanded="false" aria-controls="drawer-more-menu">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 8h.01M8 8h.01M13 8h.01"/></svg>
          </button>
          <div id="drawer-more-menu" class="more-menu" hidden></div>
        </div>
      </div>
    </div>
    <div id="drawer-body" class="drawer-body"></div>
  </aside>

  <dialog id="spawn-dlg" class="dlg">
    <p id="spawn-msg"></p>
    <div class="dlg-btns">
      <button id="spawn-cancel" class="btn">Cancel</button>
      <button id="spawn-run" class="btn primary">Run</button>
    </div>
  </dialog>

  <div id="toast" class="toast" role="status"></div>
  <script src="dependency-hover.js"></script>
  <script src="board.js"></script>
</body>
</html>
